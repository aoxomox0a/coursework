[project]
name = "nl-to-sparql"
version = "0.1.0"
description = "Natural Language to SPARQL Query System"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.104.0",
    "uvicorn==0.24.0",
    "requests==2.31.0",
    "python-dotenv==1.0.0",
    "sentence-transformers==2.6.1",
    "chromadb==0.4.21",
    "numpy<2.0",
    "spacy>=3.8.13",
    "en-core-web-sm",
    "spacy-transformers>=1.4.0",
    "en-core-web-trf",
    "rdflib>=7.0.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx<0.28",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
en-core-web-trf = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl" }

[project]
name = "nl-to-sparql"
version = "0.1.0"
description = "Natural Language to SPARQL Query System"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.135.3",
    "uvicorn==0.44.0",
    "requests==2.33.1",
    "python-dotenv==1.2.2",
    "sentence-transformers==5.4.1",
    "chromadb==1.5.7",
    "numpy<2.0",
    "spacy>=3.8.14",
    "en-core-web-sm",
    "spacy-transformers>=1.4.0",
    "en-core-web-trf",
    "rdflib>=7.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "httpx<0.28",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
en-core-web-trf = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl" }
